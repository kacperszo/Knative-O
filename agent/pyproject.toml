[project]
name = "knative-o-agent"
version = "0.1.0"
description = "LangChain agent that drives Knative through the kubernetes-mcp-server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "langchain>=0.3.10",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.2,<0.3",
    "langgraph>=0.2",
    "structlog>=24.4",
    "typer>=0.13",
]

[project.scripts]
knative-o-agent = "knative_o_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knative_o_agent"]
