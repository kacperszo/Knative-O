apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: astronomy-shop
# We start from the upstream Astronomy Shop release manifest. The bootstrap
# script fetches it as `base.yaml` (pinned to ASTRONOMY_SHOP_VERSION in .env),
# so the user doesn't have to clone the demo repo manually.
resources:
  - namespace.yaml
  - base.yaml
patches:
  # Convert selected stateless services from Deployment to Knative Service.
  # See §3.2 for the rationale on which services we Knative-ize.
  - path: patches/frontend-knative.yaml
    target:
      kind: Deployment
      name: frontend
  # TODO: add the same shape of patch for productcatalog, recommendation,
  # currency, payment as we expand coverage of the demo scenarios.
