apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-agent
  namespace: mcp
  labels:
    app.kubernetes.io/name: langchain-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: langchain-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langchain-agent
    spec:
      serviceAccountName: langchain-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/kacperszo/knative-o-agent:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: webhook
              containerPort: 8080
          env:
            - name: LLM_MODEL
              value: claude-sonnet-4-6
            - name: AGENT_MODE
              value: confirm
            - name: DEMO_NAMESPACE
              value: astronomy-shop
            # The agent launches `kubernetes-mcp-server` over stdio (the binary
            # is baked into the image). Force in-cluster auth — auto-detection
            # can fail with "no configuration has been provided".
            - name: MCP_CLUSTER_PROVIDER
              value: in-cluster
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: agent-secrets, key: ANTHROPIC_API_KEY, optional: true } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: agent-secrets, key: OPENAI_API_KEY, optional: true } }
            - name: WEBHOOK_TOKEN
              valueFrom: { secretKeyRef: { name: agent-secrets, key: WEBHOOK_TOKEN } }
            - name: LANGCHAIN_TRACING_V2
              value: "false"
            - name: LANGCHAIN_API_KEY
              valueFrom: { secretKeyRef: { name: agent-secrets, key: LANGCHAIN_API_KEY, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: webhook }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: webhook }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
