# Placeholder Secret. Rendered by scripts/bootstrap.sh from .env at install
# time — the YAML below is committed only so kustomize can reference it.
# Real values must never be checked in.
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: mcp
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_FROM_ENV"
  OPENAI_API_KEY: "REPLACE_FROM_ENV"
  WEBHOOK_TOKEN: "REPLACE_FROM_ENV"
  LANGCHAIN_API_KEY: "REPLACE_FROM_ENV"
